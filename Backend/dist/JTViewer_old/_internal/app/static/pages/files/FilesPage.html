<section id="filesPage" class="page-view active" aria-labelledby="uploadedFilesTitle">
    <section class="uploads-panel" aria-labelledby="uploadedFilesTitle">
      <div class="uploads-heading">
        <div class="uploads-title-group">
          <span class="uploads-icon" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M5 4.5h14A1.5 1.5 0 0 1 20.5 6v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18V6A1.5 1.5 0 0 1 5 4.5Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 8h8M8 12h8M8 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <div>
            <h2 id="uploadedFilesTitle">All Files</h2>
            <p id="filesSubtitle" class="uploads-subtitle">Files registered in your MySQL database</p>
          </div>
        </div>
      </div>
      <div class="uploads-toolbar">
        <label class="search-box" for="fileSearch">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/>
            <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <input id="fileSearch" type="search" placeholder="Search filename, path, owner, type or ID..." autocomplete="off">
        </label>
        <button id="refreshFilesBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 11a8 8 0 0 0-14.7-3L4 10m0 0V5m0 5h5m-5 3a8 8 0 0 0 14.7 3L20 14m0 0v5m0-5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Refresh list
        </button>
      </div>
      <p id="fileListStatus" role="status" aria-live="polite">Loading uploaded files...</p>
      <div class="file-list-scroll">
        <table id="uploadedFilesTable">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Filename</th>
              <th scope="col">Server file path</th>
              <th scope="col">Type</th>
              <th scope="col">Size</th>
              <th scope="col">Uploaded</th>
              <th scope="col">Owner</th>
              <th id="jt2goActionHeader" scope="col" hidden>JT2Go</th>
            </tr>
          </thead>
          <tbody id="uploadedFilesBody"></tbody>
        </table>
      </div>
    </section>
      </section>
