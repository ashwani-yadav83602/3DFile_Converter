<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>JT Studio</title>
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="m12 2.8 8.1 4.6v9.2L12 21.2l-8.1-4.6V7.4L12 2.8Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="m3.9 7.4 8.1 4.7 8.1-4.7M12 12.1v9.1" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        JT Studio
      </div>
      <p class="sidebar-caption">Workspace</p>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <button class="sidebar-nav-button" type="button" data-view="all" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 5.5h16v13H4zM8 9h8M8 12.5h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>All Files</span>
          <span id="allFilesCount" class="nav-count">0</span>
        </button>
        <button class="sidebar-nav-button" type="button" data-view="mine" aria-current="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5.5 19a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>My Files</span>
          <span id="myFilesCount" class="nav-count">0</span>
        </button>
        <button class="sidebar-nav-button" type="button" data-view="upload" aria-current="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15V4m0 0L8 8m4-4 4 4M5 15.5v3A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Upload File</span>
        </button>
      </nav>
      <div class="sidebar-footer">Browse your uploaded JT files or add a new model to the workspace.</div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <h1 id="pageTitle" class="page-title">All Files</h1>
        <span class="topbar-note">3D MODEL WORKSPACE</span>
      </header>
      <main id="pageMount" aria-live="polite"></main>
    </div>
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
